[project]
name = "secure-serverless-security-platform"
version = "0.1.0"
description = "Securing AI agent access to regulated production data on AWS"
requires-python = ">=3.11"

# mcp_core has ZERO runtime dependencies by design: the protocol layer is
# hand-written, so its trust surface is auditable in a single sitting.
dependencies = []

[project.optional-dependencies]
rds = ["psycopg[binary]>=3.2", "sqlglot>=25.0"]
aws = ["boto3>=1.35"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "moto[guardduty,securityhub,iam,s3,kms,config]>=5.0",
  "boto3>=1.35",
  "psycopg[binary]>=3.2",
  "sqlglot>=25.0",
  "ruff>=0.6",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "mcp-servers" }

[tool.setuptools.packages.find]
where = ["mcp-servers"]
include = ["mcp_core*", "rds_readonly_mcp*", "aws_posture_mcp*"]

[tool.pytest.ini_options]
testpaths = ["mcp-servers/tests"]
pythonpath = ["mcp-servers"]
markers = [
  "integration: requires a live Postgres container (make db-up)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
# S101 (assert) is fine in tests; asserts are not a control here.
per-file-ignores = { "mcp-servers/tests/*" = ["S101", "S608"] }

[tool.bandit]
exclude_dirs = ["mcp-servers/tests", ".venv"]
